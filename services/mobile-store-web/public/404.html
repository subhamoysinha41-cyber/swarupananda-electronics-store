<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      const pathname = window.location.pathname;
      const firstSegment = pathname.split('/').filter(Boolean)[0];
      const basePath = firstSegment ? `/${firstSegment}` : '';
      const routePath = pathname.slice(basePath.length) || '/';
      const destination = `${routePath}${window.location.search}${window.location.hash}`;
      window.location.replace(`${basePath}/?p=${encodeURIComponent(destination)}`);
    </script>
  </head>
  <body>
    <p>Redirecting to the store…</p>
  </body>
</html>
